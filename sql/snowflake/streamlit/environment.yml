# streamlit_app/environment.yml
# Purpose: Declares the Anaconda-channel packages available inside the
# Streamlit-in-Snowflake sandbox. SiS only allows packages from the
# Snowflake Anaconda channel, not arbitrary pip installs.

name: app_environment
channels:
  - snowflake
dependencies:
  - streamlit=1.35
  - pandas=2.2
  - altair=5.0