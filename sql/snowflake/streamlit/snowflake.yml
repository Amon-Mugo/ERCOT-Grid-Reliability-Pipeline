# streamlit_app/snowflake.yml
# Purpose: SnowCLI project definition for the ERCOT dashboard. Tells
# `snow streamlit deploy` which files to upload, which warehouse/role to
# run under, and where in Snowflake the app object should live —
# mirrors how cd.yml declares deploy targets for the rest of this project.

definition_version: "1"

streamlit:
  name: ercot_grid_dashboard
  stage: streamlit_stage
  query_warehouse: ercot_app_wh
  main_file: streamlit_app.py
  env_file: environment.yml
  title: "ERCOT Grid Reliability Dashboard"